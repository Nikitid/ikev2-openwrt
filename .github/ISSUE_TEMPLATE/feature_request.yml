name: Feature request
description: Suggest a change or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or Russian is fine.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and why it matters to you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen instead.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you tried or considered.
