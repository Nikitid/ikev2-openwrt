name: Question
description: Help with installing, configuring or using the project
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: >-
        English or Russian is fine. Check the README and the documentation it
        links to first. Remove passwords, keys, public addresses and private
        domains from everything you paste.
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you are trying to do and where you got stuck.
    validations:
      required: true
